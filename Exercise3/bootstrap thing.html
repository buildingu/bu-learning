<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Lesson 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>


    <!--Bootstrap Grid System-->
    <div class="container">
        <!--Row 1-->
        <div class="row">
            <!--Column 1-->
            <div class="col">Column 1</div>
            <div class="col">Column 2</div>
            <div class="col">Column 3</div>
        </div>
        <!--Row 2-->
        <div class="row">
            <!--Column 2-->
            <div class="col">Column 1</div>
            <div class="col">Column 2</div>
            <div class="col">Column 3</div>
        </div>
        <!--Row 3-->
        <div class="row">
            <!--Column 3-->
            <div class="col">Column 1</div>
            <div class="col">Column 2</div>
            <div class="col">Column 3</div>
        </div>
    </div>
    <br>
    <h1>Heading 1</h1>
    <p class="h1 text-success text-uppercase text-center">Paragraph Heading 1</p>
    <!--Buttons-->
    <button type="button" class="btn btn-outline-success btn-lg">Base class</button>

    <!--Form-->
    <form>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control is-valid" required>
            <div class="invalid-feedback">
                Please enter your email address.
            </div>
        </div>
        <button type="submit" class="btn-btn-primary">Submit</button>
    </form>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="https://www.google.com">Google</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDiv" 
        aria-controls="navbarDiv" aria-expanded="false" aria-label="Toggle Navbar">
            <!--Hamburger Icon-->
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDiv">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="https://www.youtube.com">YouTube</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="https://www.spotify.com">Spotify</a>
                </li>
            </ul>
        </div>
    </nav>
    <!--Modal-->
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exModal">
        Click to Open
    </button>

    <div class="modal fade" id="exModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <p>Hello!</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
