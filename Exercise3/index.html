<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 3</title>
        <!-- Meta data -->
        <!-- Character Set (typing) -->
        <meta charset="UTF-8"/>
        <!-- Search Engine Key Words -->
        <meta name="keywords" content="HTML5"/>
        <!-- Description -->
        <meta name="description" content="EXERCISE 3"/>
        <!-- Author -->
        <meta name="author" content="Gabriel Rodriguez"/>
        <!-- Viewport -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
        <header>
        <h1>Exercise 3 by Gabriel Rodriguez</h1>
        <h3>Date Submitted: May 9, 2026</h3>
        </header>
        <hr>
        <h3>Fun Facts about me: </h3>
    <table>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Favorite Movie</th>
            <th>Favorite Song</th>
            <th>Favorite Video</th>
        </tr>
        <!-- Second Row -->
        <tr>
            <td>Gabriel</td>
            <td>Rodriguez</td>
            <td><img src="assets/Avatar.jpeg" alt="Avatar movie poster"></td>
            <td>
                <audio controls>
                    <source src="assets/BallGame.mp3" type="audio/mpeg">
                </audio>
            </td>
            <td>
                <iframe 
                title="Favorite video"
                src="https://www.youtube.com/embed/nb_fFj_0rq8"
                allowfullscreen>
                </iframe>
            </td>
        </tr>
    </table>
    <hr>
    <h3>Enter your details below:</h3>
    <div class="section">
        <form>
            <label for="fullname"> Full Name:</label><br>
            <input id="fullname" name="fullname" type="text" placeholder="John Doe"><br><br>

            <label for="email" >Email Address:</label><br>
            <input id="email" name="email" type="email" placeholder="john.doe@example.com"><br><br>

            <label for="password" >Password:</label> <br>
            <input id="password" name="password" type="password" placeholder="••••••••"><br><br>
                <!-- em used for emphasis -->
                    <p><em>Available Meeting Days</em></p>
                    <div class="meeting-days">
                    <label for="monday"><input id="monday" type="radio" name="meeting-day"> Monday</label>
                    <label for="tuesday"><input id="tuesday" type="radio" name="meeting-day"> Tuesday</label>
                    <label for="wednesday"><input id="wednesday" type="radio" name="meeting-day"> Wednesday</label>
                    <label for="thursday"><input id="thursday" type="radio" name="meeting-day"> Thursday</label>
                    <label for="friday"><input id="friday" type="radio" name="meeting-day"> Friday</label>
                    <label for="saturday"><input id="saturday" type="radio" name="meeting-day"> Saturday</label>
                    <label for="sunday"><input id="sunday" type="radio" name="meeting-day"> Sunday</label>
                    </div><br>

                <label for="available-time"><em>Available Time</em>:</label><br>
                    <select id="available-time" name="available-time">
                            <option value="morning">Morning (8am to 12pm)</option>
                            <option value="afternoon">Afternoon (12pm to 4pm)</option>
                            <option value="evening">Evening (4pm to 8pm)</option>
                    </select><br><br>
                <label for="working-yes">Currently working on a new website?</label><br>
                <label for="working-yes">
                    <input id="working-yes" type="radio" name="answer" value="yes"> Yes
                </label>
                <label for="working-no">
                            <input id="working-no" type="radio" name="answer" value="no"> No
                        </label><br><br>
                    <label for="comments">Comments:</label><br>
                    <textarea id="comments" name="comments" rows="4" placeholder="Your comments here..."></textarea><br><br>
                <div class="form-actions">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>
        </form>
    </div>
    </main>
    </body>
</html>
