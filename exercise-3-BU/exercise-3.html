<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 by John Doe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a252f;
            background-image: 
                linear-gradient(45deg, transparent 40%, rgba(199, 21, 133, 0.4) 41%, rgba(199, 21, 133, 0.4) 42%, transparent 43%),
                linear-gradient(-45deg, transparent 40%, rgba(199, 21, 133, 0.35) 41%, rgba(199, 21, 133, 0.35) 42%, transparent 43%),
                linear-gradient(90deg, transparent 40%, rgba(199, 21, 133, 0.3) 41%, rgba(199, 21, 133, 0.3) 42%, transparent 43%),
                linear-gradient(0deg, transparent 40%, rgba(199, 21, 133, 0.25) 41%, rgba(199, 21, 133, 0.25) 42%, transparent 43%);
            background-size: 100px 100px, 70px 70px, 50px 50px, 80px 80px;
            background-position: 0 0, 30px 30px, 15px 15px, 45px 45px;
            background-attachment: fixed;
            color: white;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(52, 73, 94, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #bdc3c7;
        }

        /* Fun Facts Section */
        .fun-facts {
            background: rgba(52, 73, 94, 0.9);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .fun-facts h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #ecf0f1;
        }

        .facts-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            text-align: center;
        }

        .fact-item {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 5px;
            border: 2px solid #7f8c8d;
        }

        .fact-item h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ecf0f1;
        }

        .fact-content {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-poster {
            width: 80px;
            height: 100px;
            background-color: #95a5a6;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #2c3e50;
        }

        .audio-player, .video-player {
            width: 100%;
            height: 60px;
            background-color: #95a5a6;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            font-size: 12px;
        }

        /* Form Section */
        .form-section {
            background: rgba(189, 195, 199, 0.95);
            color: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .form-section h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #95a5a6;
            border-radius: 3px;
            font-size: 14px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .checkbox-item input[type="checkbox"] {
            margin: 0;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit {
            background-color: #27ae60;
            color: white;
        }

        .btn-submit:hover {
            background-color: #2ecc71;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        /* Advanced Selectors */
        /* Example 1: :not() selector - Style inputs that don't have the 'no-border' class */
        input:not(.no-border) {
            border-width: 2px;
        }

        /* Example 2: :nth-child() selector - Style odd-numbered fact items */
        .fact-item:nth-child(odd) {
            border-color: #e74c3c;
        }

        /* Desktop Styles */
        @media screen and (min-width: 768px) {
            .container {
                padding: 40px;
            }
            
            .header h1 {
                font-size: 32px;
            }
            
            .facts-grid {
                gap: 25px;
            }
            
            .fact-item {
                padding: 25px;
            }
        }

        /* Mobile Styles */
        @media screen and (max-width: 767px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .facts-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .fact-item {
                padding: 15px;
            }
            
            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Exercise 3 by Ishan Dawady</h1>
            <p>Date submitted: 7/24/2025</p>
        </div>

        <!-- Fun Facts Section -->
        <div class="fun-facts">
            <h2>Fun facts about me:</h2>
            <div class="facts-grid">
                <div class="fact-item">
                    <h3>First Name</h3>
                    <div class="fact-content">
                        <p>Ishan</p>
                    </div>
                </div>
                <div class="fact-item">
                    <h3>Last Name</h3>
                    <div class="fact-content">
                        <p>Dawady</p>
                    </div>
                </div>
                <div class="fact-item">
                    <h3>Favorite Movie</h3>
                    <div class="fact-content">
                        <img src="https://upload.wikimedia.org/wikipedia/en/4/4d/Avengers_Infinity_War_poster.jpg" 
                             alt="Avengers Infinity War" 
                             style="width: 80px; height: 100px; border-radius: 3px; object-fit: cover;">
                    </div>
                </div>
                <div class="fact-item">
                    <h3>Favorite Song</h3>
                    <source src="embrace-364091.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                    </audio>
                </div>
                <div class="fact-item">
                    <h3>Favorite Video</h3>
                    <video width="320" height="240" controls>
                    <source src="videoplayback.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <h2>Enter your details below:</h2>
            <form>
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="•••••">
                </div>
                
                <div class="form-group">
                    <label>Available Meeting Days:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="monday" name="days" value="monday">
                            <label for="monday">Monday</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="tuesday" name="days" value="tuesday">
                            <label for="tuesday">Tuesday</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="wednesday" name="days" value="wednesday">
                            <label for="wednesday">Wednesday</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="thursday" name="days" value="thursday">
                            <label for="thursday">Thursday</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="friday" name="days" value="friday">
                            <label for="friday">Friday</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="saturday" name="days" value="saturday">
                            <label for="saturday">Saturday</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="sunday" name="days" value="sunday">
                            <label for="sunday">Sunday</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="time">Available Time:</label>
                    <select id="time" name="time">
                        <option value="">Select a time</option>
                        <option value="morning">Morning (9am to 12pm)</option>
                        <option value="afternoon">Afternoon (1pm to 5pm)</option>
                        <option value="evening">Evening (6pm to 9pm)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Currently working on a new website?</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="yes" name="website" value="yes">
                            <label for="yes">Yes</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="no" name="website" value="no">
                            <label for="no">No</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="details">If yes, please enter which page(s) you are working on:</label>
                    <textarea id="details" name="details" placeholder="Enter your comments here..."></textarea>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-submit">Submit</button>
                    <button type="reset" class="btn btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
