<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Devansh Malhotra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Exercise 3 by Devansh Malhotra</h1>
  <p class="date">Date submitted: October 11, 2025</p>
  <hr>

  <h3>Fun facts about me:</h3>
  <table>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Favorite Movie</th>
      <th>Favorite Song</th>
      <th>Favorite Video</th>
    </tr>
    <tr>
      <td>Devansh</td>
      <td>Malhotra</td>
      <td>
        <a href="https://en.wikipedia.org/wiki/Raiders_of_the_Lost_Ark" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/a6/Raiders_of_the_Lost_Ark_Theatrical_Poster.jpg/250px-Raiders_of_the_Lost_Ark_Theatrical_Poster.jpg" 
               alt="Raiders of the Lost Ark" width="100">
        </a>
      </td>
      <td><audio controls src="assets/rick_roll.mp3"></audio></td>
      <td><video controls width="150" src="assets/marvel_studios.mp4"></video></td>
    </tr>
  </table>
  
  <hr>

  <h3>Enter your details below:</h3>
    <form onsubmit="return false;"> <!-- Disables form submission -->
    <label>Full Name: 
      <input type="text" name="fullname" placeholder="John Doe" required>
    </label><br><br>

    <label>Email Address: 
      <input type="email" name="email" placeholder="john.doe@example.com" required>
    </label><br><br>

    <label>Password: 
      <input type="password" name="password" placeholder="Enter your password" required>
    </label><br><br>

    <p>Available Days:</p>
    <div class="checkbox-group">
      <label><input type="checkbox" name="days" value="Mon"> Monday</label>
      <label><input type="checkbox" name="days" value="Tue"> Tuesday</label>
      <label><input type="checkbox" name="days" value="Wed"> Wednesday</label>
      <label><input type="checkbox" name="days" value="Thu"> Thursday</label>
      <label><input type="checkbox" name="days" value="Fri"> Friday</label>
      <label><input type="checkbox" name="days" value="Sat"> Saturday</label>
      <label><input type="checkbox" name="days" value="Sun"> Sunday</label>
    </div>

    <label>Available Time:
      <select>
        <option>Morning</option>
        <option>Afternoon</option>
        <option>Evening</option>
      </select>
    </label><br><br>

    <p>Working on a New Website?</p>
    <div class="radio-group">
      <label><input type="radio" name="newWebsite" value="Yes" checked> Yes</label>
      <label><input type="radio" name="newWebsite" value="No"> No</label>
    </div>

    <label>Comments:<br>
      <textarea rows="4" cols="40" placeholder="Add any comments here..."></textarea>
    </label><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>

  <footer>Desktop Version®</footer>
</body>
</html>
