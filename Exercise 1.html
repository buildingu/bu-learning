<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Exercise 1 by Pranit Loganathan</title>
</head>

<body>

<h1 align="center">Exercise 1 by Pranit Loganathan</h1>
<h3 align="center">Date submitted: 11/29/2025</h3>
<hr>

<h2 align="center">Fun facts about me:</h2>

<table border="1" cellpadding="10" align="center">
    <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Favorite Movie</th>
        <th>Favorite Song</th>
        <th>Favorite Video</th>
    </tr>
    <tr>
        <td>Pranit</td>
        <td>Loganathan</td>
        <td>
            <img src="indiana_jones_logo.svg" width="150" alt="Indiana Jones Logo">
        </td>
        <td>
            <audio controls>
                <source src="sunflower.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </td>
        <td>
            <video controls width="250">
                <source src="favorite_video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </td>
    </tr>
</table>

<hr>

<h4 align="center">Enter your details below</h4>

<form align="center">
    <label for="fname">Full Name:</label>
    <input type="text" id="fname" name="fname" placeholder="Enter your full name">
    <br><br>

    <label for="EmailAddr">Email Address:</label>
    <input type="email" id="EmailAddr" name="EmailAddr" placeholder="Enter your email">
    <br><br>

    <label for="Passcode">Password:</label>
    <input type="password" id="Passcode" name="Passcode" placeholder="Enter your password">
    <br><br>

    <h5>Available Meeting Days:</h5>
    <label><input type="checkbox" name="day" value="Monday"> Monday</label>
    <label><input type="checkbox" name="day" value="Tuesday"> Tuesday</label>
    <label><input type="checkbox" name="day" value="Wednesday"> Wednesday</label>
    <label><input type="checkbox" name="day" value="Thursday"> Thursday</label>
    <label><input type="checkbox" name="day" value="Friday"> Friday</label>
    <label><input type="checkbox" name="day" value="Saturday"> Saturday</label>
    <label><input type="checkbox" name="day" value="Sunday"> Sunday</label>
    <br><br>

    <label for="timeslot">Available Time:</label>
    <select id="timeslot" name="timeslot">
        <option value="monday8to12">Monday 8am to 12pm</option>
    </select>
    <br><br>

    <label>Currently working on new website?</label>
    <label><input type="radio" name="agree" value="yes" checked> Yes</label>
    <label><input type="radio" name="agree" value="no"> No</label>
    <br><br>

    <label for="comments">Additional Comments:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comments here"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>

</body>
</html>
