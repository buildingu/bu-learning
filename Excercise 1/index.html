<table border="1" align="center">
  <tr>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Favorite Movie</th>
    <th>Favorite Song</th>
    <th>Favorite Video</th>

  <tr>
    <td>Shreya</td>
    <td>Raghavendra</td>

      <audio controls>
        <source src="Lo-fi Hip Hop 30 second Loop.mp3" type="audio/mpeg">

        <source src="rainy Day [short 30 sec animation].mp4" type="video/mp4">

      </video>

<hr>
<h3>Enter your details below:</h3>
<!-- Information Form -->
<form>
  <label>Full Name:</label>
  <input type="text" name="fullname" placeholder="Enter your full name"><br><br>

  <label>Email Address:</label>
  <input type="email" name="email" placeholder="Enter your email"><br><br>

  <label>Password:</label>
  <input type="password" name="password" placeholder="Enter your password"><br><br>

  <p>Available Meeting Days:</p>
  <input type="checkbox" name="days" value="Monday"> Monday
  <input type="checkbox" name="days" value="Tuesday"> Tuesday
  <input type="checkbox" name="days" value="Wednesday"> Wednesday
  <input type="checkbox" name="days" value="Thursday"> Thursday
  <input type="checkbox" name="days" value="Friday"> Friday
  <input type="checkbox" name="days" value="Saturday"> Saturday
  <input type="checkbox" name="days" value="Sunday"> Sunday

  <br><br>
  <label>Available Time:</label>
  <select name="time">
    <option value="morning">Morning (10am - 12pm)</option>
    <option value="afternoon">Afternoon (12pm - 7pm)</option>
    <option value="evening">Evening (3pm - 6pm)</option>
  </select>

  <br><br>
  <label>Working on a new Website?</label>
  <input type="radio" name="website" value="yes" checked> Yes
  <input type="radio" name="website" value="no"> No

  <br><br>
  <textarea name="comments" cols="30" rows="4" placeholder="Enter any comments here..."></textarea>

  <br><br>
  <button type="submit">Submit</button>
  <button type="reset">Reset</button>
</form>

</body>
</html>
