<script id="jsbin-javascript">
function formValidator(fName, lName, age, phoneNum) {
  if (!fName){
    console.log("Please enter your first name");
    return;
  } else if (typeof fName !== 'string') {
    console.log("The first name should be a string data type");
    return;
  }
  
  
  if (!lName){
    console.log("Plase enter your last name");
    return;
  } else if (typeof lName !== 'string') {
    console.log("The last name should be a string data type");
    return;
  }
  
  
  if (!age){
    console.log("Please enter your age");
    return;
  } else if (typeof age !== 'number') {
    console.log("The age should be a number");
    return;
  }
  
  if (!phoneNum){
    console.log("Please enter your phone number");
    return;
  } else if (typeof phoneNum !== 'string') {
    console.log("The phone number should be a string data type");
    return;
  }
  
}
</script>
