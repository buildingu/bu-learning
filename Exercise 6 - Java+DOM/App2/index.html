<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Exercise 6 Employee Entry App</title>
    </head>
    <body>
        <div class="main-container">
            <input type="text" id="name" placeholder="John J. Doe">
            <input type="number" id="age" placeholder="30">
            <select name="gender" id="sex">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="position" placeholder="Intern">
            <button type="button" id="saveButton">Add Entry</button>
            <ul id="entriesList"></ul>
        </div>
        <script src="script.js"></script>
    </body>
</html>
