<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADOS App</title>
    <link rel="stylesheet" href="../styles/validator.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">ADOS APP</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <div class="card">
        <h2>ADOS App</h2>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Enter first name">
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" id="age" placeholder="Minimum 18">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phoneNumber" placeholder="e.g. 555-0123">
        </div>

        <button id="submitBtn">Create Account</button>

        <div id="messageBox"></div>
    </div>

    <script src="../logic/validator.js"></script>
