<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CRUD form for user management" />
  <meta name="keywords" content="CRUD, Web App, Form" />
  <meta name="author" content="Your Name" />
  <link rel="stylesheet" href="/Exercise 6/styles/crud.css" />
  <link rel="icon" type="image/x-icon" href="/Exercise 6/assets/CRUD_icon.jpg">
  <title>CRUD App</title>
</head>
<body>
  <nav>
    <ul>
      <li><a href="/Exercise 6/pages/Home.html">Home</a></li>
      <li><a href="/Exercise 6/pages/Validator.html">Validator</a></li>
      <li><a href="/Exercise 6/pages/Crud.html">CRUD</a></li>
      <li><a href="/Exercise 6/pages/Location.html">Location</a></li>
    </ul>
  </nav>

  <div class="container">
    <form id="crudForm">
      <fieldset>
        <legend>Enter Employee Information</legend>

        <label for="name">Name:</label>
<input type="text" id="name" placeholder="Enter full name">

<label for="age">Age:</label>
<input type="number" id="age" placeholder="Enter age">

<label for="sex">Sex:</label>
<select id="sex">
    <option value="">Select sex</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>

<label for="position">Position:</label>
<input type="text" id="position" placeholder="Enter job position">
        <br /><br />

        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </div>

  <div id="userData"></div>

  <script src="/Exercise 6/logic/crudapp.js"></script> 
</body>
</html>
