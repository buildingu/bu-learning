<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="/Exercise 6/assets/CRUD_icon.jpg" />
  <title>CRUD App</title>
</head>
<body>
  <nav>
    <ul>
      <li><a href="/Exercise 6/pages/Home.html">Home</a></li>
      <li><a href="/Exercise 6/pages/Validator.html">Validator</a></li>
      <li><a href="/Exercise 6/pages/Crud.html">CRUD</a></li>
      <li><a href="/Exercise 6/pages/Location.html">Location</a></li>
    </ul>
  </nav>

  <div class="container">
    <form id="crudForm">
      <fieldset>
        <legend>Enter Employee Information</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" required placeholder="e.g. Bob Smith" />
        <br /><br />

        <label for="age">Age:</label>
        <input type="number" id="age" required min="18" max="100" placeholder="e.g. 30" />
        <br /><br />

        <label for="sex">Sex:</label>
        <select id="sex" required>
          <option value="">Select</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <br /><br />

        <label for="position">Position:</label>
        <input type="text" id="position" required placeholder="e.g. Manager" />
        <br /><br />

        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </div>

  <div id="userData" class="output"></div>

  <script src="/Exercise 6/logic/crud.js"></script>
</body>
</html>

  <div id="userData"></div>

  <script src="/Exercise 6/logic/crudapp.js"></script> 
</body>
</html>
