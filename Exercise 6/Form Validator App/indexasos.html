<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validator App</title>
  <link rel="stylesheet" href="styleasos.css">
</head>
<body>
  <div class="container">
    <h1>Sign Up</h1>
    <form id="validatorForm">
      <input type="text" id="firstName" placeholder="First Name">
      <input type="text" id="lastName" placeholder="Last Name">
      <input type="number" id="age" placeholder="Age">
      <input type="text" id="phoneNumber" placeholder="Phone Number (9 digits)">
      <button type="submit">Submit</button>
    </form>
    <div id="messages"></div>
  </div>
  <script src="validator-DOM.js"></script>
</body>
</html>
