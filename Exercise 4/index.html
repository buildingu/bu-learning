<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Exercise 1: HTML</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
  <body>
    <h1>Exercise 3 by Anika Dureja</h1>
    <h2>Date submitted: 07/02/2025</h2>
    <hr />
    <h3>Fun facts about me:</h3>
    <table>
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Favorite Movie Image</th>
          <th>Favorite Music Audio Sample</th>
          <th>Favorite Video Sample</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-label="First Name">Anika</td>
          <td data-label="Last Name">Dureja</td>
          <td data-label="Favorite Movie Image">
            <img
              src="https://static.wikia.nocookie.net/marvelcinematicuniverse/images/b/b2/Morris_%28Dijiang%29.png/revision/latest?cb=20231021023725"
              alt="Morris"
            />
          </td>
          <td data-label="Favorite Music Audio Sample">
            <p>Click to play audio</p>
            <audio controls>
              <source
                src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"
                type="audio/mpeg"
              />
            </audio>
          </td>
          <td data-label="Favorite Video Sample">
            <video controls>
              <source
                src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                type="video/mp4"
              />
            </video>
          </td>
        </tr>
      </tbody>
    </table>
    <hr />
    <h3>Enter your details below:</h3>
    <form>
      <p>
        <label for="fullName">Full Name:</label><br />
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
        />
      </p>
      <p>
        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" placeholder="Email" />
      </p>
      <p>
        <label for="password">Password:</label><br />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
        />
      </p>
      <p>
        <label>Available Meeting Days:</label><br />
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="monday"
            name="availableDays"
            value="monday"
          />
          <label for="monday">Monday</label>
          <input
            type="checkbox"
            id="tuesday"
            name="availableDays"
            value="tuesday"
          />
          <label for="tuesday">Tuesday</label>
          <input
            type="checkbox"
            id="wednesday"
            name="availableDays"
            value="wednesday"
          />
          <label for="wednesday">Wednesday</label>
          <input
            type="checkbox"
            id="thursday"
            name="availableDays"
            value="thursday"
          />
          <label for="thursday">Thursday</label>
          <input
            type="checkbox"
            id="friday"
            name="availableDays"
            value="friday"
          />
          <label for="friday">Friday</label>
          <input
            type="checkbox"
            id="saturday"
            name="availableDays"
            value="saturday"
          />
          <label for="saturday">Saturday</label>
          <input
            type="checkbox"
            id="sunday"
            name="availableDays"
            value="sunday"
          />
          <label for="sunday">Sunday</label>
        </div>
      </p>
      <p>
        <label for="availableTime">Available Time:</label><br />
        <select id="availableTime" name="availableTime">
          <option value="morning">Morning (9am to 12pm)</option>
          <option value="afternoon">Afternoon (12pm to 5pm)</option>
          <option value="evening">Evening (5pm to 9pm)</option>
        </select>
      </p>
      <p>
        <label>Currently working on a new website?:</label><br />
        <div class="radio-group">
          <input
            type="radio"
            id="yesNewWebsite"
            name="newWebsite"
            value="yes"
            checked
          />
          <label for="yesNewWebsite">Yes</label>
          <input type="radio" id="noNewWebsite" name="newWebsite" value="no" />
          <label for="noNewWebsite">No</label>
        </div>
      </p>
      <p>
        <label for="comments">Comments:</label><br />
        <textarea
          id="comments"
          name="comments"
          rows="4"
          cols="50"
          placeholder="Enter your comments here..."
        ></textarea>
      </p>
      <p class="button-group">
        <input type="submit" value="Submit" />
        <input type="reset" value="Reset" />
      </p>
    </form>
    <footer>
      <p>&copy; 2025 Anika Dureja. All rights reserved.</p>
    </footer>
  </body>
</html>
