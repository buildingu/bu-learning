<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="styling.css"/>
        <title>Advanced CSS intro</title>
    </head>

    <body>
        <!--Element Selector-->
        <a href="https://www.google.com">Click to go to Google.</a>       
        <a href="https://www.youtube.com">Click to go to YouTube.</a>
        <button>Click me!</button>
        <br>
        <input type="text">
        <p>This is a line. <br> This is another one.</p>
        <img src="img_assets/another_one.jfif" alt="Picture of the almighty DJ Khaled">
        <p>Hi there CSS!</p>
        <p id="second-paragraph"> Hi there CSS!(reverb+slowed)</p>
        <p class="style-paragraph">No more hi there CSS for you.</p>
        <img src="img_assets/book.jfif" alt="Picture of a book">
        <main class="parent">
            <div class="child">
                <p class="grandchild">Thing 1</p>
                <p>Thing 3</p>
                <p>Thing 4</p>
                <p>Thing 5</p>
            </div>

            <div>
                <p>Thing 2</p>
                <a href="https://maps.google.com">Click here to go to Google Maps.</a>
            </div>
        </main>

</html>
