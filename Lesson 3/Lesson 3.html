<!DOCTYPE html> 
<html>
<head>
<title>HTML</title>
<meta charset="UTF-8">
<meta name="keywords" content="HTML5">
<meta name="description" content="HTML 5 Tutorial">
<meta name="author" content="Shania">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<style>
  body{
    text-align: center;
    text-align: center;
  } 
  table{
    border: 1px, solid black;
    margin: auto;
  }
    
    @media screen and (min-width: 768px) {

     body {
  background-image: url(background-desktop.jpg);
  color: white

    }
    th{
        background-color: steelblue;
    }
    table{
        background-color:slategray
    }
    form{
        padding:5px;
        border:5px solid gray;      
        background-color: lightgrey;
}
.week{
    color:rgb(0, 0, 0);
}
.yes{
    color: black;
}
.green{
    background-color: green;
    color: white;
}
.red{
    background-color: red;
    color:white;
}
label{
    color: black;
    
}
    } 

    
    </style>
    <style>
@media screen and (max-width: 767px) {
body{
 text-align: center;
 background-image: url(background-mobile.jpg)

 }

td{
 overflow: hidden;
text-overflow: ellipsis;
 word-wrap: break-word;
}
 p, h4, th, td, h2{
 color: rgb(255, 255, 255);
 text-align: center;
 }
 th{
 background-color:rgb(173, 63, 19) ;
 }
 tr{
display: flex;
 flex-direction: column;
 background-color: rgb(126, 49, 25);
 }

 img{
width: 100px;
 }
audio{
 width: 200px;
 }
 video{
 width:250px;
 }

 form{
 background-color: rgb(201, 196, 196);
 }
    
}
</style>


</head>
<body>
    
 
<div>
<h2>Exercise 1: HTML </h2>
<h4> 7/22/2025 </h4>


<hr>
<h4>Fun Facts About Me:</h4>
<table border="1">

    <tr>
       <th>First Name</th>
       <th>Last Name</th> 
       <th>Favorite Movie</th>
       <th>Favorite Music Audio Sample</th>
       <th>Favorite Video Sample</th>
    </tr>
    
    <tr>
    <td><center>John</center></td>
    <td><center>Doe</center></td>
    <td><img src="3 Idiots.jpg" alt="3 Idiots" width="350">
            </td>
    <td>
        <center>
        Click button to play music:
        </center>
        <br>
        <audio controls>
        <source src="washing machine heart1.mp3" type="audio/mpeg">
        </audio>
    </td>
    <td>
        <video width="320" height="320" controls>
        <source src="washing machine heart video1.mp4" type="video/mp4">
    </td>
    </tr>
    
</table> 

<hr>

<main>
   
    <h4>Enter your details below:</h4>
    <form>
        <label><i>Full Name: </i></label>
        <input type="text" placeholder="John Doe">

        <br>
        <br>

        <label><i>Email:</i> </label>
        <input type="email" placeholder="jdoe@fakemail.com">

        <br>
        <br>

        <label><i>Password:</i></label>
        <input type="password"placeholder="●●●●"> <br><br>

        <label><i>Available Meeting Days:</i></label>

        <br>
        <br>
        <div class="week">
        <input type="checkbox">Sunday
        <input type="checkbox">Monday
        <input type="checkbox">Tuesday
        <input type="checkbox">Wednesday
        <input type="checkbox">Thursday
        <input type="checkbox">Friday
        <input type="checkbox">Saturday
            </div>
        <br>
        <br>

        <label><i>Available Time:</i></label>
            <select name="Time" id="Time">
               <option value="morning (8am to 12pm)">Morning (8am to 12pm)</option>
                <option value="afternoon (12pm to 6pm)">Afternoon (12pm to 6pm)</option>
                <option value="evening (6am to 9pm)">Evening (6am to 9pm)</option>
                <option value="night (9pm to 8am)">Night (9pm to 8am)</option>
            </select>
        
        <br>
        <br>

        <label><i>Working on a New Website?</i></label>
       <div class="yes"><input type="radio" name="color" value="red"> Yes 
       <input type="radio"name="color" value="Green"> No
        </div>
        <br>
        <br>

              
        <textarea cols="20" rows="2" placeholder="Enter your comments here"></textarea>

        <br>
        <br>
        
        <input class="green" type="submit" value="Submit">
        
        <input class="red" type="reset">
        

    </form>
 
</div>
</main>

   
</body>

</html>
