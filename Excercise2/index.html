<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Game at Lake Washington High School</title>
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <header class="header">
      <h1>Basketball Game at Lake Washington High School!</h1>
      <h3>Join us this Friday after school at 5 pm!</h3>
    </header>

    <section class="info">
      <h2>Event Details</h2>
      <table>
        <tr>
          <th>Location</th>
          <td>Lake Washington High School Gymnasium</td>
        </tr>
        <tr>
          <th>Date & Time</th>
          <td>Friday, October 27th, 5:00 pm</td>
        </tr>
        <tr>
          <th>Guests</th>
          <td>All students, family, and friends</td>
        </tr>
      </table>
    </section>

    <section class="media">
      <h2>Check Out the Hype!</h2>
      <img src="assets/basketball.jpeg" alt="Basketball Game" width="400">
      <video width="400" height="275" controls>
        <source src="assets/bballvid.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </section>

    <section class="contact">
      <h2>Contact Information</h2>
      <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <div class="form-group">
          <label>Available Days:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="day" value="Friday"> Friday</label>
            <label><input type="checkbox" name="day" value="Saturday"> Saturday</label>
          </div>
        </div>

        <div class="form-group">
          <label for="time">Preferred Contact Time:</label>
          <select id="time" name="time">
            <option value="morning">Morning</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
          </select>
        </div>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
    </section>
  </body>
</html>
