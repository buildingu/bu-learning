<!DOCTYPE html>
    <html>
        <head>
            <title>CRUD app</title> 
            <link rel="stylesheet" href="CRUD.css">
        </head>

        <body>
            <h1>CRUD App</h1>
            <p id = "result"></p>
            <form id = "form">
                <input type="text" placeholder="Enter your First Name" id = "fName">
                <br>
                <input type="text" placeholder="Enter your Last Name" id="lName">
                <br>
                <input type="text" placeholder="Enter your Age" id = "age">
                <br>
                <input type="text" placeholder="Enter your Phone Number" id="pNumber">
                <br>

                <button type="submit" >Submit</button>

            </form>

            

            <script src = "CRUD.js"></script>
        </body>
                                                                
    </html>
