<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript and the Dom Exercise, Part 2</title>
    <link rel="stylesheet" href="jsDom_exercise2.css" />
  </head>

  <body>
    <h1>Employee Entry App</h1>

    <form>
      <label for="name" id="Name">Enter name:</label>
      <input type="text" placeholder="name" id="name_input" /><br /><br />

      <label for="age" id="Age">Enter age:</label>
      <input type="text" placeholder="age" id="age_input" /><br /><br />

      <label for="gender" id="Gender">Enter gender:</label>
      <input type="text" placeholder="gender" id="gender_input" /><br /><br />

      <label for="position" id="Position">Enter position:</label>
      <input
        type="text"
        placeholder="position"
        id="position_input"
      /><br /><br />

      <button type="button" id="add_Button">Add Entry</button>
    </form>
    <p id="employee_details">Employee Details</p>
    <ol id="storage"></ol>
    <script src="jsDom_exercise2.js"></script>
  </body>
</html>
