<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript and the Dom Exercise, Part 1</title>
    <link rel="stylesheet" href="jsDom_exercise1.css" />
  </head>

  <body>
    <h1>Form validator App</h1>

    <form>
      <label for="name" id="first_name">Enter first name: </label>
      <input
        type="text"
        id="first_name_input"
        placeholder="first name"
      /><br /><br />

      <label for="name" id="last_name">Enter last name: </label>
      <input
        type="text"
        id="last_name_input"
        placeholder="last name"
      /><br /><br />

      <label for="name" id="phone_number">Enter phone number: </label>
      <input
        type="text"
        id="phone_number_input"
        placeholder="phone number"
      /><br /><br />

      <label for="name" id="age">Enter age: </label>
      <input type="text" id="age_input" placeholder="age" /><br />
      <button type="button" id="button">Submit</button>
    </form>
    <script src="jsDom_exercise1.js"></script>
  </body>
</html>
