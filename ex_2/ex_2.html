<!DOCTYPE html>
<html>
    <head>
        <title>Senior Sunrise</title>

        <meta charset="UTF-8"/>
        <meta name="description" content="CSS practice"/>

        <link rel="stylesheet" href="ex_2.css">
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta http-equiv="refresh" content="30"/>
    </head>

    <body>
        <h1>JOIN US AT THE SENIOR SUNRISE!</h1>

        <fieldset>
        <table class="first">
            <tr>
                <th class="details">details:</th>
                <th class="details">what to bring:</th>
            </tr>
            <tr>
                <td class="details">where: football field <br>where: senior class only! <br>when: 6 am, august 16th <br>
                <td class="details">phone <br>water bottle <br>blanket <br>picnic mats<br>
            </tr>
        </table>
        </fieldset>
        <div>FOOD AND DRINKS PROVIDED!!</div>

        <fieldset>
        <table class="second">
            <tr>
                <th class="details">pizza</th>
                <th class="details">boba</th>
                <th class="details">ice cream</th>
            </tr>
            <tr>
                <td>
                    <a href="https://www.papajohns.com/"><img src="ex_2/pizza.jpg" alt="Pizza" width="300" height="300"></a>
                </td>
                <td>
                    <img src="ex_2/boba.jpg" alt="Boba" width="300" height="300">
                </td>
                <td>
                    <a href="https://www.coldstonecreamery.com/"><img src="ex_2/icecream.jpg" alt="Ice Cream" width="300" height="300"></a>
                </td>
            </tr>
        </table>
        </fieldset>

        <div>RSVP ASAP!</div>

        <fieldset>
        <form>
            <label>Full Name: </label>
            <input type="text" placeholder="John Doe"><br>
            <label>Email:     </label>
            <input type="email" placeholder="user@example.com"><br>
            <p>Food request: 
            <input type="checkbox"> pizza
            <input type="checkbox"> <label for="boba">boba:</label>
        <select name="boba" id="boba">
            <option value="brown">brown sugar milk tea</option>
            <option value="thai">thai tea</option>
            <option value="taro">taro milk tea</option>
            <option value="mango">mango fruit tea</option>
        </select>
            <input type="checkbox"> <label for="icecream">ice cream:</label>
        <select name="icecream" id="icecream">
            <option value="cookie">cookie dough</option>
            <option value="rocky">rocky road</option>
            <option value="chocolate">chocolate fudge</option>
            <option value="strawberry">strawberry</option>
            </p>
        </select>
        <p>Attending? 
            <input type="radio" name="attending" checked> yes
            <input type="radio" name="attending"> no
            </p>
        </form>
        <p>Music Requests?</p>
        <textarea cols="30" rows="10"></textarea>
        <br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        </fieldset>
    </body>
</html>
