        <h2>Personal Information Form</h2>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>
    
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
    
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter a password"><br><br>
    
            <label>Available Days:</label><br>
            <input type="checkbox" name="days" value="Monday"> Monday<br>
            <input type="checkbox" name="days" value="Tuesday"> Tuesday<br>
            <input type="checkbox" name="days" value="Wednesday"> Wednesday<br>
            <input type="checkbox" name="days" value="Thursday"> Thursday<br>
            <input type="checkbox" name="days" value="Friday"> Friday<br>
            <input type="checkbox" name="days" value="Saturday"> Saturday<br>
            <input type="checkbox" name="days" value="Sunday"> Sunday<br><br>
    
            <label for="time">Available Time:</label>
            <select id="time" name="time">
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
            </select><br><br>
    
            <label>Working on a New Website?</label><br>
            <input type="radio" name="website" value="yes" checked> Yes
            <input type="radio" name="website" value="no"> No<br><br>
    
            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" placeholder="Enter your comments here"></textarea><br><br>
    
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
