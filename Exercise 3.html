    <p><h4>Enter contact information here</h4></p>
    <div class="form">
    <form style="text-align: center; justify-content: center;">

        <p>
        <label for="fname"><i><b>Full Name:</b></i></label><br>
        <input type="text" id="fname" name="fname" placeholder="Navyashree Balasubramaniyan Nagarajan" maxlength="30"><br>
        </p>

        <p>
        <label for="email"><i><b>Email:</b></i></label><br>
        <input type="text" id="email" name="email" placeholder="nbalas@gmail.com"><br>
        </p>

        <p>
        <label for="password"><i><b>Password:</b></i></label><br>
        <input type="password" id="password" name="password" placeholder="••••••••••••"><br>
        </p>

        <p>
        <label><i><b>Available Days:</b></i></label><br>
        <input type="checkbox" id="day1" name="day1">
        <label for="day1">Monday</label>
        <input type="checkbox" id="day2" name="day2">
        <label for="day2">Tuesday</label>
        <input type="checkbox" id="day3" name="day3">
        <label for="day3">Wednesday</label>
        <input type="checkbox" id="day4" name="day4">
        <label for="day4">Thursday</label>
        <input type="checkbox" id="day5" name="day5">
        <label for="day5">Friday</label><br>
        <input type="checkbox" id="day6" name="day6">
        <label for="day6">Saturday</label>
        <input type="checkbox" id="day7" name="day7">
        <label for="day7">Sunday</label>
        </p>

        <p>
         <label for="time"><i><b>Available Time:</b></i></label><br>
        <input type="time" id="time" name="time">
        </p>

         <p>
         <label><i><b>Working on a New Website?</b></i></label><br>
        <input type="radio" id="yes" name="yes" checked>
         <label for="yes">Yes</label>
        <input type="radio" id="no" name="no">
         <label for="no">No</label>
        </p>

        <p>
        <label for="comments"><i><b>Comments:</b></i></label><br>
        <textarea id="comments" name="comments" placeholder="Enter your comments here" maxlength="200"></textarea>
        </p>
        <input type="submit" name="Submit">
        <input type="reset" name="Reset">
    </form>
    </div>
    </body>
