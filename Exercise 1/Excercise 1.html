            <!--Form Section-->
            <h2>Personal Information Form</h2>
            <form>
              <label for="fullname">Full Name:</label><br>
              <input type="text" id="fullname" placeholder="Enter your full name"><br><br>
              <label for="email">Email:</label><br>
              <input type="email" id="email" placeholder="Enter your email"><br><br>
              <label for="passowrd">Password:</label><br>
              <input type="password" id="password" placeholder="Enter your password"><br><br>

              <label>Avaliable Days:</label><br>
              <input type="checkbox" name="days" value="Monday"> Monday
              <input type="checkbox" name="days" value="Tuesday"> Tuesday
              <input type="checkbox" name="days" value="Wednesday"> Wednesday
              <input type="checkbox" name="days" value="Thursday"> Thursday
              <input type="checkbox" name="days" value="Friday"> Friday<br><br>

              <label for="time">Available Time:</label><br>
              <select id="time" name="time">
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
              </select><br><br>

              <label>Working on a New Website?:</label><br>

              <input type="radio" id="no" name="newsite" value="No"> No

              <label for="comments">Comments:</label><br>
              <textarea id="comments" name="comments" rows="4" cols="40" placeholdr="'Enter addition Information..."></textarea>

              <input type="reset" value="Reset">
