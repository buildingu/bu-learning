<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1: HTML</title>
</head>
<body>

    <!-- 1. Headings -->
    <h1 align="center">Exercise 1 by Aaryan Varshney</h1>
    <h3 align="center">Date submitted: 10/31/2026</h3>

    <hr>

    <!-- 2. Table Section -->
    <h3 align="center">Fun facts about me:</h3>

    <table border="1" cellpadding="10" cellspacing="0" align="center">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Favorite Movie</th>
                <th>Favorite Song</th>
                <th>Favorite Video</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">John</td>
                <td align="center">Doe</td>
                <td align="center">
                    <a href="https://en.wikipedia.org/wiki/Indiana_Jones" target="_blank">
                        <img src="movie_cover.jpg" alt="Indiana Jones" width="100">
                    </a>
                </td>
                <td align="center">
                    <p>Click play button to play music:</p>
                    <audio controls>
                        <source src="audio_sample.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </td>
                <td align="center">
                    <video width="200" controls>
                        <source src="video_sample.mp4" type="video/mp4">
                        Your browser does not support the video element.
                    </video>
                </td>
            </tr>
        </tbody>
    </table>

    <hr>

    <!-- 3. Form Section -->
    <h3 align="center">Enter your details below:</h3>

    <form align="center">
        
        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe"><br><br>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="john.doe@example.com"><br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="••••••••"><br><br>

        <!-- Available Days -->
        <label>Available Meeting Days:</label><br>
        <input type="checkbox" id="monday" name="day" value="Monday">
        <label for="monday">Monday</label>
        <input type="checkbox" id="tuesday" name="day" value="Tuesday">
        <label for="tuesday">Tuesday</label>
        <input type="checkbox" id="wednesday" name="day" value="Wednesday">
        <label for="wednesday">Wednesday</label>
        <input type="checkbox" id="thursday" name="day" value="Thursday">
        <label for="thursday">Thursday</label>
        <input type="checkbox" id="friday" name="day" value="Friday">
        <label for="friday">Friday</label>
        <input type="checkbox" id="saturday" name="day" value="Saturday">
        <label for="saturday">Saturday</label>
        <input type="checkbox" id="sunday" name="day" value="Sunday">
        <label for="sunday">Sunday</label><br><br>

        <!-- Available Time -->
        <label for="time">Available Time:</label>
        <select id="time" name="time">
            <option value="morning">Morning (8am to 12pm)</option>
            <option value="afternoon">Afternoon (12pm to 4pm)</option>
            <option value="evening">Evening (4pm to 8pm)</option>
        </select><br><br>

        <!-- Radio Buttons -->
        <label>Currently working on new website?</label>
        <input type="radio" id="yes" name="working_on_site" value="Yes" checked>
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="working_on_site" value="No">
        <label for="no">No</label><br><br>

        <!-- Comments -->
        <textarea name="comments" rows="4" cols="30" placeholder="Enter your comments here..."></textarea><br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit" onclick="return false;">
        <input type="reset" value="Reset" onclick="return false;">

    </form>

</body>
</html>
