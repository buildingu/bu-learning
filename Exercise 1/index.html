<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Exercise 1 by Rohan R</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width" initial-scale="1.0"/>
        <meta http-equiv="X-UA-Compatible" content="ie-edge"/>

    </head>
    <body>
        <center>
        <main>
            <h1>Exercise 1 by Rohan Ravulapelli</h1>
            <h3>Date submitted: 7/14/2026</h3>
            <table>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Favorite Movie</th>
                    <th>Favorite Song</th>
                    <th>Favorite Video</th>
                </tr>
                <tr>
                    <td>Rohan</td>
                    <td>Ravulapelli</td>
                    <td><img src="assets/up.jpg" alt="Picture of the movie Up" href="https://en.wikipedia.org/wiki/Up_(2009_film)" width="200" height="200"/></td>
                    <td><audio controls><source src="assets/stitches.mp3" type="audio/mp4"><source src="assets/stitches.ogg" type="audio/ogg">Your browser does not support the audio element</audio></td>
                    <td><video width="200" height="200" controls><source src="assets/cube.mp4" type="video/mp4"/><source src="assets/cube.webm" type="video/webm"/>Your browser does not support the video element</video></td>
                </tr>
            </table>
            <form>
                <fieldset>
                <h3>Enter your details below:</h3>
                <label>Enter your full name: </label>
                <input type="text"/ placeholder="Ex: John Doe"> <br><br>
                <label>Please enter your email:</label>
                <input type="email"/ placeholder="Ex: johndoe@gmail.com"> <br><br>
                <label>Please enter your password:</label>
                <input type="password"/ placeholder="Ex: cats1234"> <br><br>
                <label>Available Meeting Days:</label><br><br>
                Monday <input type="checkbox"/>
                Tuesday <input type="checkbox"/>
                Wednesday <input type="checkbox"/>
                Thursday <input type="checkbox"/>
                Friday <input type="checkbox"/>
                Saturday <input type="checkbox"/>
                Sunday <input type="checkbox"/><br><br>
                <label>Available Time:</label>
                <select>
                    <option>4:00</option>
                    <option>5:00</option>
                    <option>6:00</option>
                    <option>7:00</option>
                    <option>8:00</option>
                </select><br><br>
                <label>Working on a new website?</label>
                <input type="radio" checked/>Yes
                <input type="radio"/>No <br><br>
                <textarea cols="20" rows="5" placeholder="Enter your comments here"></textarea><br><br>
                <input type="submit"/>
                <input type="reset"/>
                </fieldset>
            </form>
        </main>
        </center>
    </body>
</html>
