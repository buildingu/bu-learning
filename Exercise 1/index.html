<!DOCTYPE html>
<html>

<head>
    <!--Title-->
    <title>Intro to HTML5</title>
    <!--Metadata-->
    <!--Character set -->
    <meta charset="UTF-8" />
    <!--Keywords-->
    <meta name="Keywords" content="HTML5" />
    <!--Description-->
    <meta name="description content = " HTML5 Tutorial" />
    <!--Author-->
    <meta name="author" content="V" />
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, intial - scale=1" />
    <!-- Refresh Document-->
    <meta http-equiv="refresh" content="30" />

</head>

<body>
    <h1>Hello HTML5</h1>
    <h2>Hello HTML5</h2>
    <h3>Hello HTML5</h3>
    <h4>Hello HTML5</h4>
    <h5>Hello HTML5</h5>
    <h6>Hello HTML5</h6>

    <p> <strong>Welcome</strong> to <b>HTML5</b>
        <br>
        <i>June, 2025</i>
    </p>

    <!--Span tag -->
    <p><span>Testing</span> 1, 2, 3 ...</p>

    <!-- Hyperlink tag-->
    <a href="http://www.google.com" target="_blank">Click to go to google</a>

    <!--Unorder list-->
    <ul>
        <li>Apple </li>
        <li>Banana </li>
        <li>Orange </li>
    </ul>

    <!--Ordered list-->
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>

    <!--Image-->
    <img src="assets/Mickey_Mouse.png" alt="Picture of Mickey Mouse" />

    <div>
    </div>

    <!--Tables-->
    <table>
        <!--First row-->
        <tr>
            <!--Header-->
            <th>Person</th>
            <th>Age</th>
        </tr>

        <!--Second Row-->
        <tr>
            <td>Chris</td>
            <td>38</td>
        </tr>

        <tr>
            <td>Jack</td>
            <td>28</td>
        </tr>
    </table>
    
</body>

</html>
