<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - HTML Building-U</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        form {
            width: 300px;
            margin: auto;
            text-align: left;
        }

        label {
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Exercise 1: HTML Building-U</h1>
    <h3>Date of Submission: 31 March 2026</h3>

    <h2>Student Information Table</h2>

    <table>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Favorite Movie Image</th>
            <th>Favorite Music Audio Sample</th>
            <th>Favorite Video Sample</th>
        </tr>

        <tr>
            <td>Sarang</td>
            <td>Menon</td>

            <td>
                <a href="https://en.wikipedia.org/wiki/Indiana_Jones" target="_blank">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNQzbT-XiKTd_1nhFCiT2j44mkLFowYXFbSA&s"
                         width="120"
                         alt="Indiana Jones Movie Poster">
                </a>
            </td>

            <td>
                <audio controls>
                    <source src="sample-audio.mp3" type="audio/mpeg">
                    Your browser does not support audio.
                </audio>
            </td>

            <td>
                <video width="200" controls>
                    <source src="sample-video.mp4" type="video/mp4">
                    Your browser does not support video.
                </video>
            </td>
        </tr>
    </table>

    <h2>Registration Form</h2>

    <form action="#" method="post">

        <div class="form-group">
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="fullname" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password">
        </div>

        <div class="form-group">
            <label>Available Days:</label><br>
            <label><input type="checkbox" name="days" value="Monday"> Monday</label><br>
            <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label><br>
            <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label><br>
            <label><input type="checkbox" name="days" value="Thursday"> Thursday</label><br>
            <label><input type="checkbox" name="days" value="Friday"> Friday</label>
        </div>

        <div class="form-group">
            <label for="time">Available Time:</label><br>
            <select id="time" name="time">
                <option value="" disabled selected>Select Time</option>
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
            </select>
        </div>

        <div class="form-group">
            <label>Working on a New Website?</label><br>
            <label><input type="radio" name="website" value="yes" checked> Yes</label>
            <label><input type="radio" name="website" value="no"> No</label>
        </div>

        <div class="form-group">
            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" placeholder="Enter your comments here"></textarea>
        </div>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
