    <center>
        <h3>Enter your details below:</h3>
        <form>
            <label for="fullName">Full Name: </label>
            <input type="text" id="fullName" placeholder="John Doe"><br><br>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="example@gmail.com"><br><br>

            <label for="password">Password:</label>
            <input type="text" id="password" placeholder="password123"><br><br>

            <p>Available Days:</p>

            <input type="checkbox" id="mon">
            <label for="mon">Monday</label>

            <input type="checkbox" id="tue">
            <label for="tue">Tuesday</label>

            <input type="checkbox" id="wed">
            <label for="wed">Wednesday</label>

            <input type="checkbox" id="thur">

            <input type="checkbox" id="fri">
            <label for="fri">Friday</label>

            <input type="checkbox" id="sat">
            <label for="sat">Saturday</label>

            <input type="checkbox" id="sun">
            <label for="sun">Sunday</label><br><br>

            <label for="availibilityD">Available Time: </label>
            <select id="availibilityD">
                <option value="morning">Morning (8AM to 12PM)</option>
                <option value="afternoon">Afternoon (1PM to 5PM)</option>
                <option value="evening">Evening (6PM to 10PM)</option>
            </select>
            <p>Currently working on new Website?</p>
            <label for="yes">Yes</label>
            <input name="choice" type="radio" id="yes" value="yes" checked>

            <label for="no">No</label>
            <input name="choice" type="radio" id="no" value="no"><br><br>
