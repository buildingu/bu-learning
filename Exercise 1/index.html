<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>Exercise 1 by Jasur Abduxakimov</h1>
        <h4>Date submitted: 26/07/2025</h4>

        <fieldset>
            <h4>Fun facts about me:</h4>

            <table align="center" border=”5px” bordercolor="red" cellpadding=”5px” bgcolor="grey">
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Favourite Movie</th>
                    <th>Favourite Song</th>
                    <th>Favourite Video</th>
                </tr>
                <tr>
                    <td>Jasur</td>
                    <td>Abduxakimov</td>
                    <td><a href="https://en.wikipedia.org/wiki/Harry_Potter"><img src="assets/harry_potter.jpg" width="100px" alt=""></a></td>
                    <td><audio src="assets/music.mp3" controls></audio></td>
                    <td><video src="assets/animation_2.mp4" controls width="200px"></video></td>
                </tr>
            </table>
        </fieldset>

        <h4>Enter your details below:</h4>
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Jasur Abduxakimov"><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="abdc@gmail.com"><br><br>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="****"><br><br>

            <label for="days">Available meeting days:</label><br><br>            
            <input id="monday" type="checkbox">
            <label for="monday">Monday</label>
            <input id="tuesday" type="checkbox">
            <label for="tuesday">Tuesday</label>
            <input id="wednesday" type="checkbox">
            <label for="wednesday">Wednesday</label>
            <input id="thursday" type="checkbox">
            <label for="thursday">Thursday</label>
            <input id="friday" type="checkbox">
            <label for="friday">Friday</label>
            <input id="saturday" type="checkbox">
            <label for="saturday">Saturday</label>
            <input id="sunday" type="checkbox">
            <label for="sunday">Sunday</label><br><br>

            <label for="time">Available Time:</label>
            <select>
                <option>Morning (8am to 12pm)</option>
                <option>Evening (8pm to 12am)</option>
            </select><br><br>

            <label for="working">Currently working on new website:</label>
            <input id="working-yes" type="radio" checked>Yes
            <input id="working-no" type="radio">No <br><br>
            <textarea id="comments" placeholder="Enter your comments here"></textarea><br><br>
            <input id="submit-btn" type="submit">
            <input id="reset-btn" type="reset">
        </form>
    </center>
</body>
</html>
