<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1</title>
  </head>
  <body>
    <center>
      <h1>Exercise 1 by Hrishi Patel</h1>
      <p>Date submitted: 11/18/2024</p>
      <p>Date resubmitted: 11/30/2024</p>
      <h2>Fun facts about me:</h2>
      <table border="1" cellspacing="0" cellpadding="5">
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Favorite Movie</th>
          <th>Favorite Song</th>
          <th>Favorite Video</th>
        </tr>
        <tr>
          <td><center>Hrishi</center></td>
          <td><center>Patel</center></td>
          <td>
            <img
              src="assets/Oppenheimer.jpg"
              alt="Favorite Movie"
              width="100"
            />
          </td>
          <td>
            <audio controls>
              <source
                src="assets/The Weeknd - Blinding Lights (Official Audio).mp3"
                type="audio/mpeg"
              />
            </audio>
          </td>
          <td>
            <video width="150" controls>
              <source
                src="assets/4772983-uhd_2160_3840_24fps.mp4"
                type="video/mp4"
              />
            </video>
          </td>
        </tr>
      </table>
      <h3>Enter your details below:</h3>
      <form>
        <label for="fullname"> <i>Full Name:</i></label>
        <input
          type="text"
          id="fullname"
          name="fullname"
          value="Hrishi Patel"
        /><br /><br />
        <label for="email"> <i>Email Addr:</i> </label>
        <input
          type="email"
          id="email"
          name="email"
          value="hrishi8731@gmail.com"
        /><br /><br />
        <label for="password"><i>Password:</i> </label>
        <input
          type="password"
          id="password"
          name="password"
          value="******"
        /><br /><br />
        <p><i>Available Meeting Days:</i></p>
        <input type="checkbox" id="monday" name="meetingdays" value="Monday" />
        <label for="monday">Monday</label>
        <input
          type="checkbox"
          id="tuesday"
          name="meetingdays"
          value="Tuesday"
        />
        <label for="tuesday">Tuesday</label>
        <input
          type="checkbox"
          id="wednesday"
          name="meetingdays"
          value="Wednesday"
        />
        <label for="wednesday">Wednesday</label>
        <input
          type="checkbox"
          id="thursday"
          name="meetingdays"
          value="Thursday"
        />
        <label for="thursday">Thursday</label>
        <input type="checkbox" id="friday" name="meetingdays" value="Friday" />
        <label for="friday">Friday</label>
        <input
          type="checkbox"
          id="saturday"
          name="meetingdays"
          value="Saturday"
        />
        <label for="saturday">Saturday</label>
        <input type="checkbox" id="sunday" name="meetingdays" value="Sunday" />
        <label for="sunday">Sunday</label><br /><br />
        <label for="time">Available Time:</label>
        <select id="time" name="time">
          <option value="morning" selected>Morning (8am to 12pm)</option>
          <option value="afternoon">Afternoon (12pm to 5pm)</option>
          <option value="evening">Evening (5pm to 9pm)</option>
        </select>
        <br /><br />
        <p>Currently working on new website?</p>
        <input type="radio" id="yes" name="working" value="yes" checked />
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="working" value="no" />
        <label for="no">No</label><br /><br />
        <textarea
          id="comments"
          name="comments"
          rows="4"
          cols="40"
          placeholder="Enter your comments here"
        ></textarea
        ><br /><br />
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
    </center>
  </body>
</html>
