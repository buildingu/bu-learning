<!DOCTYPE html>
<html>
<head>
  <title>Exercise 1 by Ishita Sahoo</title>
</head>
<body>

  <!-- Centered Title and Subtitle -->
  <center>
    <h1>Exercise 1 by Ishita Sahoo</h1>
    <h3>Date submitted: 19/07/2025</h3>
    <h3>Fun facts about me:</h3>
  </center>

  <!-- Table Section -->
  <center>
    <table border="10" bordercolor="gray" bgcolor="skyblue" cellpadding="10">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Favorite Movie</th>
        <th>Favorite Song</th>
        <th>Favorite Video</th>
      </tr>
      <tr>
        <td>Ishita</td>
        <td>Sahoo</td>
        <td>
          <a href="https://en.wikipedia.org/wiki/Indiana_Jones">
            <img src="https://upload.wikimedia.org/wikipedia/en/1/18/Raiders_of_the_Lost_Ark.jpg" alt="Indiana Jones" width="100">
          </a>
        </td>
        <td>
          <p>Click play button to play music:</p>
          <audio controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        </td>
        <td>
          <video width="200" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </td>
      </tr>
    </table>
  </center>

  <br><br>

  <!-- Form Section -->
  <center>
    <h3>Enter your details below:</h3>
    <form>

      <!-- Full Name -->
      <label><b>Full Name</b></label><br>
      <input type="text" placeholder="John Doe"><br><br>

      <!-- Email -->
      <label><b>Email Addr</b></label><br>
      <input type="email" placeholder="jdoe@fakemail.com"><br><br>

      <!-- Password -->
      <label><b>Password</b></label><br>
      <input type="password" placeholder="Enter your password"><br><br>

      <!-- Available Meeting Days -->
      <label><b>Available Meeting Days:</b></label><br>
      <input type="checkbox">Monday
      <input type="checkbox">Tuesday
      <input type="checkbox">Wednesday
      <input type="checkbox">Thursday
      <input type="checkbox">Friday
      <input type="checkbox">Saturday
      <input type="checkbox">Sunday<br><br>

      <!-- Available Time -->
      <label><b>Available Time:</b></label>
      <select>
        <option>Morning (8am to 12pm)</option>
        <option>Afternoon (12pm to 5pm)</option>
        <option>Evening (5pm to 9pm)</option>
      </select><br><br>

      <!-- Working on Website -->
      <label><b>Currently working on new website?</b></label><br>
      <input type="radio" name="website" checked>Yes
      <input type="radio" name="website">No<br><br>

      <!-- Comments -->
      <textarea rows="4" cols="40" placeholder="Enter your comments here"></textarea><br><br>

      <!-- Submit / Reset -->
      <input type="submit" value="submit">
      <input type="reset" value="reset">

    </form>
  </center>

</body>
</html>
