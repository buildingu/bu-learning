<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 1: HTML Building-U</title>
</head>
<body>

  <!-- Heading with exercise title and date -->
  <h1>Exercise 1 by Anish Seelam</h1>
  <h3>Date of Submission: July 16, 2025</h3>

  <!-- Table Section -->
  <h2>Fun Facts About Me</h2>
    <table border="10" cellpadding="20" bordercolor="red" bgcolor="grey">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Favorite Movie </th>
      <th>Favorite Song</th>
      <th>Favorite Video</th>
    </tr>
    <tr>
      <td>Anish</td>
      <td>Seelam</td>
      <td>
        <a href="https://en.wikipedia.org/wiki/The_Amazing_Spider-Man_(film)">
          <img src="Assets/TASM.png" alt="The Amazing Spider-Man" width="300" height="400">
        </a>
      </td>
      <td>
        <audio controls>
          <source src="Assets/Play This.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </td>
      <td>
        <video width="200" controls>
          <source src="Assets/tigerzoo.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </td>
    </tr>
  </table>

  <!-- Form Section -->
  <h2>User Information Form</h2>
  <form>
    <fieldset>
    <p>
      Full Name:<br>
      <input type="text" placeholder="Enter your full name">
    </p>
    <p>
      Email:<br>
      <input type="email" placeholder="Enter your email">
    </p>
    <p>
      Password:<br>
      <input type="password" placeholder="Enter your password">
    </p>
    <p>
      Available Days:<br>
      <input type="checkbox" id="monday"> <label for="monday">Monday</label>
      <input type="checkbox" id="tuesday"> <label for="tuesday">Tuesday</label>
      <input type="checkbox" id="wednesday"> <label for="wednesday">Wednesday</label>
      <input type="checkbox" id="thursday"> <label for="thursday">Thursday</label>
      <input type="checkbox" id="friday"> <label for="friday">Friday</label>
    </p>
    <p>
      Available Time:
      <select>
        <option>Morning</option>
        <option>Afternoon</option>
        <option>Evening</option>
      </select>
    </p>
    <p>
      Working on a New Website?:<br>
      <input type="radio" name="website" id="yes" checked> <label for="yes">Yes</label>
      <input type="radio" name="website" id="no"> <label for="no">No</label>
    </p>
    <p>
      Comments:<br>
      <textarea rows="4" cols="40" placeholder="Enter any comments or additional info here"></textarea>
    </p>
    <p>
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </p>
    </fieldset>
  </form>

</body>
</html>
