<!DOCTYPE html>
<html>
  <body>
    <h1>Exercise 1</h1>
    <h3>9/14/2025</h3>
    <br /><br />
    <h3>Facts about me!</h3>
    <table>
      <tr>
        <th>First name</th>
        <th>Last name</th>
        <th>Favorite Movie Image</th>
        <th>Favorite music audio sample</th>
        <th>Favorite Video Sample:</th>
      </tr>

      <tr>
        <td>Rudra</td>
        <td>Patel</td>
        <td>
          <img src="images/Supermanflying.png" alt="A image of superman" />
        </td>
        <td>
          <audio controls>
            <source
              src="images/audio/On The Flip - The Grey Room _ Density & Time.mp3"
              type="audio/mpeg"
            />
          </audio>
        </td>
        <td>
          <video width="450" height="360" controls>
            <source
              src="images/audio/7126452-hd_1920_1080_30fps.mp4"
              type="video/mp4"
            />
          </video>
        </td>
      </tr>
    </table>
    <h3>Enter your details below</h3>
    <form>
      <label for="name">Please enter your full name</label>
      <input type="text" id="name" placeholder="Elon Musk" /><br /><br />

      <label for="email">Please enter your email</label>
      <input type="email" id="email" placeholder="Elon@SpaceX" /><br /><br />

      <label for="password">Please enter your password</label>
      <input type="password" id="password" placeholder="******" /><br /><br />
      <p>Available meeting days</p>

      <label>Monday</label>
      <input type="radio" />

      <label>Tuesday</label>
      <input type="radio" />

      <label>Wednesday</label>
      <input type="radio" />

      <label>Thursday</label>
      <input type="radio" />

      <label>Friday</label>
      <input type="radio" />

      <label>Saturday</label>
      <input type="radio" />

      <label>Sunday</label>
      <input type="radio" /><br /><br /><br />

      <label for="available_time">Available Time</label>
      <select name="times" id="times">
        <option>8AM</option>
        <option>9AM</option>
        <option>10AM</option>
        <option>11AM</option></select
      ><br /><br />

      <p>Currently working on new website?</p>

      <label>Yes</label>
      <input type="radio" checked />

      <label>No</label>
      <input type="radio" /><br /><br /><br />

      <label for="comments"></label>
      <textarea
        name="comments"
        id="comments"
        placeholder="Enter your comments here"
      ></textarea
      ><br /><br />

      <input type="submit" />
      <input type="reset" />
    </form>
  </body>
</html>
