<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator App</title>
    <link rel="stylesheet" href="application1.css">
    <script src="application1.js"></script>
</head>
<body>
    <div id="form">
        <h3>Please Enter Your Details Below:</h3>
        <form>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" placeholder="John">
            <br><br>
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" placeholder="Smith">
            <br><br>
            <label for="age">Age:</label>
            <input type="text" id="age" name="age" placeholder="18">
            <br><br>
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" placeholder="123 456 7890">
            <br><br>
            <button type="button" onclick="click_alert()">SUBMIT</button>
            <button type="reset">RESET</button>
        </form>
    </div>
</body>
