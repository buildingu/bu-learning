    <div class="movie-app">
        <h1>Movie Information Finder</h1>
        <form id="movie-form" class="movie-form">
            <label for="movie-name">Enter Movie Name:</label>
            <input type="text" id="movie-name" name="movie-name" placeholder="e.g. Inception">

        </form>

        <div id="movie-details" class="movie-details">
            <h2>Movie Details</h2>
            <div id="movie-box" class="movie-box">
                <!-- Movie details will appear here -->

        </div>
    </div>
