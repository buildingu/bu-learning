<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Exercise 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href  ="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Exercise 3 by Aaron Merchant</h1>
            <h3>Date Submitted: 23/08/2025</h3>
        </header>
        
        <section class="fun-facts">
            <h2>Fun facts about me:</h2>
            <table>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Favorite Movie</th>
                    <th>Favorite Song</th>
                    <th>Favorite Video</th>
                </tr>
                <tr>
                    <td data-label="First Name">Aaron</td>
                    <td data-label="Last Name">Merchant</td>
                    <td data-label="Favorite Movie">
                        <a href="https://en.wikipedia.org/wiki/Whiplash_%282014_film%29">
                            <img src="https://i.etsystatic.com/36067604/r/il/4355d2/4230665308/il_fullxfull.4230665308_r13v.jpg" width="120" alt="Whiplash Movie Poster">
                        </a>
                    </td>
                    <td data-label="Favorite Song">
                        <audio controls>
                            <source src="assets/rick_roll.mp3" type="audio/mpeg">
                        </audio>
                    </td>
                    <td data-label="Favorite Video">
                        <video controls>
                            <source src="assets/marvel_studios.mp4" type="video/mp4">
                        </video>
                    </td>
                </tr>
            </table>
        </section>

        <section class="contact-form">
            <h2>Enter your details below:</h2>
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="abc@gmail.com">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••••">
                </div>
                
                <div class="form-group">
                    <label>Available Meeting Days:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox"> Monday</label>
                        <label><input type="checkbox"> Tuesday</label>
                        <label><input type="checkbox"> Wednesday</label>
                        <label><input type="checkbox"> Thursday</label>
                        <label><input type="checkbox"> Friday</label>
                        <label><input type="checkbox"> Saturday</label>
                        <label><input type="checkbox"> Sunday</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Available Time:</label>
                    <select>
                        <option>Morning (8am to 12pm)</option>
                        <option>Afternoon</option>
                        <option>Evening</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Currently working on a new website?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="website" checked> Yes</label>
                        <label><input type="radio" name="website"> No</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>If yes, please enter which page(s) you are working on</label>
                    <textarea placeholder="Enter your comments here"></textarea>
                </div>
                
                <div class="button-group">
                    <input type="submit" value="Submit" class="submit-btn">
                    <input type="reset" value="Reset" class="reset-btn">
                </div>
            </form>
        </section>
        
        <footer class="version-indicator">
        </footer>
    </div>
</body>
</html>
