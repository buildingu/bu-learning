<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Exercise 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href  ="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Exercise 3 by Aaron Merchant</h1>
            <h3>Date Submitted: 23/08/2025</h3>
        </header>
        
        <section class="fun-facts">
            <h2>Fun facts about me:</h2>
            <table>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Favorite Movie</th>
                    <th>Favorite Song</th>
                    <th>Favorite Video</th>
                </tr>
                <tr>
                    <td data-label="First Name">Aaron</td>
                    <td data-label="Last Name">Merchant</td>
                    <td data-label="Favorite Movie">
                        <a href="https://en.wikipedia.org/wiki/Whiplash_%282014_film%29">
                            <img src="https://i.etsystatic.com/36067604/r/il/4355d2/4230665308/il_fullxfull.4230665308_r13v.jpg" width="120" alt="Whiplash Movie Poster">
                        </a>
                    </td>
                    <td data-label="Favorite Song">
                        <audio controls aria-label="Favorite song audio player">
                            <source src="assets/rick_roll.mp3" type="audio/mpeg">
                        </audio>
                    </td>
                    <td data-label="Favorite Video">
                        <video controls aria-label="Favorite video player">
                            <source src="assets/marvel_studios.mp4" type="video/mp4">
                        </video>
                    </td>
                </tr>
            </table>
        </section>

        <section class="contact-form">
            <h2>Enter your details below:</h2>
            <form>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="abc@gmail.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••••">
                </div>
                
                <div class="form-group">
                    <label>Available Meeting Days:</label>
                    <div class="checkbox-group">
                        <label for="dayMonday"><input type="checkbox" id="dayMonday" name="meetingDays" value="Monday"> Monday</label>
                        <label for="dayTuesday"><input type="checkbox" id="dayTuesday" name="meetingDays" value="Tuesday"> Tuesday</label>
                        <label for="dayWednesday"><input type="checkbox" id="dayWednesday" name="meetingDays" value="Wednesday"> Wednesday</label>
                        <label for="dayThursday"><input type="checkbox" id="dayThursday" name="meetingDays" value="Thursday"> Thursday</label>
                        <label for="dayFriday"><input type="checkbox" id="dayFriday" name="meetingDays" value="Friday"> Friday</label>
                        <label for="daySaturday"><input type="checkbox" id="daySaturday" name="meetingDays" value="Saturday"> Saturday</label>
                        <label for="daySunday"><input type="checkbox" id="daySunday" name="meetingDays" value="Sunday"> Sunday</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="availableTime">Available Time:</label>
                    <select id="availableTime" name="availableTime">
                        <option>Morning (8am to 12pm)</option>
                        <option>Afternoon</option>
                        <option>Evening</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Currently working on a new website?</label>
                    <div class="radio-group">
                        <label for="websiteYes"><input type="radio" id="websiteYes" name="website" value="yes" checked> Yes</label>
                        <label for="websiteNo"><input type="radio" id="websiteNo" name="website" value="no"> No</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="workingPages">If yes, please enter which page(s) you are working on</label>
                    <textarea id="workingPages" name="workingPages" placeholder="Enter your comments here"></textarea>
                </div>
                
                <div class="button-group">
                    <input type="submit" value="Submit" class="submit-btn">
                    <input type="reset" value="Reset" class="reset-btn">
                </div>
            </form>
        </section>
        
        <footer class="version-indicator">
            © 2025 Aaron Merchant | Exercise 3
        </footer>
    </div>
</body>
</html>
