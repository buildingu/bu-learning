<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3 Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header with banner image -->
  <header>
    <img src="assets/banner.jpg" alt="Website banner" class="banner-img" />
    <h1>My Website</h1>
    <nav>
      <ul class="nav-list">
        <li class="nav-item selected-item">Home</li>
        <li class="nav-item">
          <img src="assets/icon.svg" alt="icon" class="nav-icon" /> About
        </li>
        <li class="nav-item">Contact</li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Content Section 1 -->
    <section class="content-section">
      <h2>Section 1</h2>
      <img src="assets/about.png" alt="Section image" class="section-img" />
      <p>This is the first content section.</p>
    </section>

    <!-- Content Section 2 -->
    <section class="content-section">
      <h2>Section 2</h2>
      <img src="assets/about.png" alt="Section image" class="section-img" />
      <p>This is the second content section.</p>
    </section>

    <!-- Content Section 3 -->
    <section class="content-section">
      <h2>Section 3</h2>
      <img src="assets/about.png" alt="Section image" class="section-img" />
      <p>This is the third content section.</p>
    </section>

    <!-- Form with advanced selector -->
    <form>
      <input type="text" placeholder="Your name" />
      <input type="email" placeholder="Your email" class="selected-item" />
      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>© 2025 My Website</p>
  </footer>
</body>
</html>
