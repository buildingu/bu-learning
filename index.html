<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 by Anay Singh</title>
</head>
<body>
    <main>
        <h1>Exercise 1 by Anay Singh - 10/26/2024</h1>
        
        <!-- Table Section -->
        <h2>Favorite Things Table</h2>
        <table border="1" cellpadding="10">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Favorite Movie Image</th>
                <th>Favorite Music Audio Sample</th>
                <th>Favorite Video Sample</th>
            </tr>
            <tr>
                <td>Anay</td>
                <td>Singh</td>
                <td><a href="https://en.wikipedia.org/wiki/Star_Wars"><img src="C:\Users\anay_\Downloads\star.jpg" alt="Star Wars" width="100"></a></td>
                <td><audio controls>
                    <source src="C:\Users\anay_\Downloads\Untitled video - Made with Clipchamp (1).mp4" type="audio/mpeg" alt="Unforgettable">
                    Your browser does not support the audio element.
                </audio></td>
                <td><video width="160" controls>
                    <source src="C:\Users\anay_\Downloads\Recording 2024-10-25 225408.mp4" type="video/mp4" alt="Michael Jordan">
                    Your browser does not support the video tag.
                </video></td>
            </tr>
        </table>

        <!-- Form Section -->
        <h2>Feedback Form</h2>
        <form>
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" placeholder="Enter your full name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="Enter your email address"><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" placeholder="Enter your password"><br><br>

            <label>Available Days:</label><br>
            <input type="checkbox" id="monday" name="availableDays" value="Monday">
            <label for="monday">Monday</label><br>
            <input type="checkbox" id="tuesday" name="availableDays" value="Tuesday">
            <label for="tuesday">Tuesday</label><br>
            <input type="checkbox" id="wednesday" name="availableDays" value="Wednesday">
            <label for="wednesday">Wednesday</label><br>
            <input type="checkbox" id="thursday" name="availableDays" value="Thursday">
            <label for="thursday">Thursday</label><br>
            <input type="checkbox" id="friday" name="availableDays" value="Friday">
            <label for="friday">Friday</label><br><br>

            <label for="availableTime">Available Time:</label><br>
            <select id="availableTime">
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
            </select><br><br>

            <label>Working on a New Website?</label><br>
            <input type="radio" id="yes" name="website" value="yes" checked>
            <label for="yes">Yes</label><br>
            <input type="radio" id="no" name="website" value="no">
            <label for="no">No</label><br><br>

            <label for="comments">Comments:</label><br>
            <textarea id="comments" rows="4" placeholder="Add your comments here"></textarea><br><br>

            <button type="button">Submit</button>
            <button type="button">Reset</button>
        </form>
    </main>
</body>
</html>
