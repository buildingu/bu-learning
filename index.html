<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content="width = device-width, initial-scale = 1.0">
        <title>Exercise 1: Kushal Gurram</title>
    </head>
    <body>
        <main>
            <h1>Exercise 1 by Kushal Gurram</h1>
            <h2>Date Submitted: 11/02/2024</h2>

            <!-- Code for fun facts about me -->
            <h3>Fun Facts About Me:</h3>
            <table border = "2">
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Favorite Movie</th>
                    <th>Favorite Song</th>
                    <th>Favorite Music</th>
                </tr>
                <tr>
                    <td>Kushal</td>
                    <td>Gurram</td>
                    <td>
                        <a href="https://en.wikipedia.org/wiki/Like_Mike" target = "_blank">
                            <img src="Like_Mike_Image.jpg" alt="Image of Like Mike Theatrical Poster">
                    </td>
                    <td>
                        <audio controls>
                            <source src = "Rap Music Sample.mp3" type = "audio/mp3" alt = "Rap Music">
                        </audio>
                    </td>
                    <td>
                        <video width = "300" height = "300" controls>
                            <source src = "Basketball Video.mp4" alt = "Video of Basketball at Arcade" type = "Video/mp4">
                        </video>
                    </td>
                </tr>
                </table>

                <!-- Code for the form -->
                <h3>Enter your details below:</h3>
                <form>
                    <label for="full-name">Enter Your Full Name:</label><br>
                        <input id="full-name" name="full-name" type="text" placeholder="Enter your FULL name" required /></br>

                    <label for="email">Enter Your Email:</label><br>
                        <input id="email" name="email" type="email" placeholder="Enter your email" required /></br>  
                    
                    <label for="password">Enter Your Password:</label><br>
                        <input id="password" name="password" type="password" placeholder="Enter your password" required /></br><br>
                
                    <label>Days of Availablity:</label><br>

                    <input type="checkbox" id="monday" name="availableDays" value="Monday">
                    <label for="monday">Monday</label><br>

                    <input type="checkbox" id="tuesday" name="availableDays" value="Tuesday">
                    <label for="tuesday">Tuesday</label><br>

                    <input type="checkbox" id="wednesday" name="availableDays" value="Wednesday">                        
                    <label for="wednesday">Wednesday</label><br>

                    <input type="checkbox" id="thursday" name="availableDays" value="Thursday">
                    <label for="thursday">Thursday</label><br>

                    <input type="checkbox" id="friday" name="availableDays" value="Friday">
                    <label for="friday">Friday</label><br><br>

                    <label for="time">Time of Availability:</label><br>
                    <select name="time" id="time">
                        <option value="Morning">Morning (8am to 12pm)</option>
                        <option value="Afternoon">Afternoon (12pm to 4pm)</option>
                        <option value="Morning">Morning (4pm to 8pm)</option>
                    </select><br><br>

                    <label for="working">Are you currently working on a new website?</label>
                    <input type="radio" id="yes" name="YesOrNo" value="Yes">
                    <label for="yes">Yes</label>
                    <input type="radio" id="no" name="YesOrNo" value="No">
                    <label for="no">No</label><br><br>

                    <label for="comments">Please Add Any Other Comments:</label>
                    <input type="text" id="comments" name="comments" placeholder="Any comments go here"><br><br>

                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </form>    
            </table>
        </main>
    </body>
</html>
