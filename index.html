<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 by Arav Gandhi</title>
</head>
<body>
    <h1 style="text-align: center;">Exercise 1 by John Doe</h1>
    <b><p style="text-align: center;">Date submitted: 21/05/2023</p></b>
    <hr>
    <h3 style="text-align: center;">Fun facts about me:</h3>
    <div style="width: 70%; margin: 0 auto; background-color: gray; padding: 10px; box-shadow: 5px 5px 10px lightgray;">
        <table style="width: 100%; border-collapse: separate; border-spacing: 10px; background-color: lightblue;">
            <tr>
            <th style="border: 2px solid grey; padding: 10px; text-align: center; background-color: white;">First Name</th>
            <th style="border: 2px solid grey; padding: 10px; text-align: center; background-color: white;">Last Name</th>
            <th style="border: 2px solid grey; padding: 10px; text-align: center; background-color: white;">Favorite Movie</th>
            <th style="border: 2px solid grey; padding: 10px; text-align: center; background-color: white;">Favorite Song</th>
            <th style="border: 2px solid grey; padding: 10px; text-align: center; background-color: white;">Favorite Video</th>
            </tr>
            <tr>
            <td style="border: 2px solid grey; padding: 20px; text-align: center; background-color: white;">Arav</td>
            <td style="border: 2px solid grey; padding: 20px; text-align: center; background-color: white;">Gandhi</td>
            <td style="border: 2px solid grey; padding: 20px; text-align: center; background-color: white;">
                <img src="images.jpeg" alt="Avengers Infinity War" width="80">
            </td>
            <td style="border: 2px solid grey; padding: 20px; text-align: center; background-color: white;">
                <audio controls>
                <source src="I Aint Worried.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
                </audio>
            </td>
            <td style="border: 2px solid grey; padding: 20px; text-align: center; background-color: white;">
                <iframe width="200" height="113" src="https://www.youtube.com/embed/G3_GqX1jM6Q" frameborder="0" allowfullscreen></iframe>
            </td>
            </tr>
        </table>
    </div>
    <hr>
    <h3 style="text-align: center;">Enter your details below:</h3>
    <form style="text-align: center;">
        <label for="full-name">Full Name: </label>
        <input type="text" id="full-name" name="full-name" value="John Doe"><br><br>
        
        <label for="email">Email Address: </label>
        <input type="email" id="email" name="email" value="jdoe@fakemail.com"><br><br>
        
        <label for="password">Password: </label>
        <input type="password" id="password" name="password" value="password"><br><br>
        
        <p>Available Meeting Days:</p>
        <input type="checkbox" id="monday" name="monday">
        <label for="monday">Monday</label>
        <input type="checkbox" id="tuesday" name="tuesday">
        <label for="tuesday">Tuesday</label>
        <input type="checkbox" id="wednesday" name="wednesday">
        <label for="wednesday">Wednesday</label>
        <input type="checkbox" id="thursday" name="thursday">
        <label for="thursday">Thursday</label>
        <input type="checkbox" id="friday" name="friday">
        <label for="friday">Friday</label>
        <input type="checkbox" id="saturday" name="saturday">
        <label for="saturday">Saturday</label>
        <input type="checkbox" id="sunday" name="sunday">
        <label for="sunday">Sunday</label><br><br>
        
        <label for="available-time">Available Time: </label>
        <select id="available-time" name="available-time">
            <option value="morning">Morning (8am to 12pm)</option>
            <option value="afternoon">Afternoon (12pm to 4pm)</option>
            <option value="evening">Evening (4pm to 8pm)</option>
        </select><br><br>
        
        <p>Currently working on new website?</p>
        <input type="radio" id="yes" name="working-on-website" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="working-on-website" value="no">
        <label for="no">No</label><br><br>
        
        <textarea rows="4" cols="50" placeholder="Enter your comments here"></textarea><br><br>
        
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
