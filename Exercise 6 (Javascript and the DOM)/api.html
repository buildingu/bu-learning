<link rel="stylesheet" href="bootstrap-5.3.6-dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">

<section id="api" class="my-5 position-relative">
    <img src="premium_photo-1701534008693-0eee0632d47a copy.jpeg" alt="Background" class="bg-image" />
    <div class="overlay-content container">
        <h2 class="mb-4 text-center">API App</h2>
        <form class="needs-validation" novalidate id="apiForm">
            <div class="mb-3">
                <label for="number" class="form-label text-white">How many random facts about cat you would like to know</label>
                <input type="number" class="form-control" id="number" autocomplete="number" required />
                <div class="invalid-feedback">Please enter how many facts about cat you would like to know.</div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%">Submit</button>
        </form>
    </div>
</section>


<script src="bootstrap-5.3.6-dist/js/bootstrap.bundle.min.js"></script>
