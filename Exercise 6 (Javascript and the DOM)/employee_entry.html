<link rel="stylesheet" href="bootstrap-5.3.6-dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">

<section id="employeeEntry" class="my-5 position-relative">
    <img src="premium_photo-1701534008693-0eee0632d47a copy.jpeg" alt="Background" class="bg-image" />
    <div class="overlay-content container">
        <h2 class="mb-4 text-center">Employee Entry App</h2>
        <form class="needs-validation" novalidate id="employeeEntryForm">
            <div class="mb-3">
                <label for="name" class="form-label text-white">Name</label>
                <input type="text" class="form-control" id="name" autocomplete="name" required />
                <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
                <label for="age" class="form-label text-white">Age</label>
                <input type="number" class="form-control" id="age" autocomplete="off" required />
            </div>

            <div class="mb-3">
                <label for="sex" class="form-label text-white">Sex</label>
                <input type="text" class="form-control" id="sex" autocomplete="sex" required />
            </div>

            <div class="mb-3">
                <label for="position" class="form-label text-white">Position</label>
                <input type="text" class="form-control" id="position" autocomplete="organization-title" required />
            </div><br>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</section>


<script src="bootstrap-5.3.6-dist/js/bootstrap.bundle.min.js"></script>
