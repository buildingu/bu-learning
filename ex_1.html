<!DOCTYPE html>
<html>

    <body>
        <h1>Exercise 1</h1>

    <br>
    <body>
        <h3>Favorite things:</h3>
        <fieldset>
        <table>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Movie Poster</th>
                <th>Sound</th>
                <th>Video</th>
            </tr>
            <tr>
                <td>Aarna</td>
                <td>Kamath</td>
                <td><img src="movieimage.jpg" height=200 width=150 alt="Cheaper By the Dozen Movie Poster"></td>
                <td><audio controls>
                    <source src="cat-meow.mp3" type="audio/mp3"></td>
                <td><video width="400" controls>
                    <source src="video-sample.mp4" type="video/mp4"></td>
            </tr>
        </table>
        </fieldset>
    </body>
    <br>
    <body>
        <h3>Enter details below:</h3>
        <fieldset>
        <form>
            <label>Full Name: </label>
            <input type="text"><br><br>
            <label>Email:     </label>
            <input type="text"><br><br>
            <label>Password:  </label>
            <input type="text">
        </form>
        </fieldset>
        <br>
        <form>
            <p>Available Days: 
            <input type="radio"> Monday
            <input type="radio"> Tuesday
            <input type="radio"> Wednesday
            <input type="radio"> Thursday
            <input type="radio"> Friday
            </p>
        </form>
        <label for="times">Available Time:</label>
        <select name="times" id="times">
            <option value="morning">morning (10am to 12pm)</option>
            <option value="afternoon">afternoon (1pm to 3pm)</option>
            <option value="evening">evening (3pm to 5pm)</option>
        </select>
        <form>
            <p>Working on a new website? 
            <input type="radio"> yes
            <input type="radio"> no
            </p>
        </form>
        <br>
        <p>Comments?</p>
        <textarea cols="30" rows="10"></textarea>
        <br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </body>
</html>
