<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prom Night 2025</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Prom Night 2025</h1>
        <h3>"A Night At The Museum"</h3>
        <img src="https://www.fernbankmuseum.org/media/dnrluglv/later_resized_img_3231.jpg" alt="Prom Image" />
    </header>

    <div class="info-box">
        <h2>Event Information</h2>

        <table>
            <tr>
                <th>Location</th>
                <td>Fernbank Museum, Atlanta</td>
            </tr>
            <tr>
                <th>Date</th>
                <td>Apr 12, 2025</td>
            </tr>
            <tr>
                <th>Time</th>
                <td>7:00 PM - 11:00 PM</td>
            </tr>
            <tr>
                <th>Who's Invited?</th>
                <td>All Juniors and Seniors</td>
            </tr>
        </table>
    </div>

    <div class="media-box">
        <h2>Prom Playlist</h2>
        <label for="suggestions">Send us your suggestions for the prom playlist:</label>
        <textarea id="suggestions" name="suggestions" rows="2"></textarea>

        <button type="submit">Submit</button>
    </div>

    <div class="contact-box">
        <h2>Event Description</h2>
        <p>Join us for an unforgettable time at the 2025 Prom Night!</p>
    </div>

    <form>
        <h2>Contact Us</h2>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="2"></textarea>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
