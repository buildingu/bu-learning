<body>

        <h1>Exercise 1 by Wen Ting Wang</h1>
        <p><b>Date submitted: 01/06/2025</b></p>
        <hr>
        <p><b>Fun fact about me:</b></p>

        <table border="1" cellspacing="10" cellpadding="10" bgcolor="sandybrown" align="center" width="80%">
            <tr bgcolor="#f2f2f2">
                <th>First Name</th>
                <th>Last Name</th>
                <th>Favorite Movie</th>
                <th>Favorite Song</th>
                <th>Favorite Video</th>
            </tr>
            <tr bgcolor="white" align="center" valign="middle">
                <td>Wen Ting</td>
                <td>Wang</td>
                <td>
                    <a href="https://en.wikipedia.org/wiki/Scream_(franchise)" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/en/c/c9/Scream_VI_poster.jpg" alt="Scream"

                </td>
                <td>
                    Click play button to play music:<br>

                    </audio>
                </td>
                <td>
                    <video width="300" controls>
                        <source src="Video.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </td>
            </tr>
        </table>

        <hr>

        <p><b>Enter your details below:</b></p>
        <form>
            <label>
                <i>
                    Full Name
                </i>
            </label>
            <input type="text" placeholder="Wen Ting Wang"><br><br>

            <label>
                <i>
                    Email Address
                </i>
            </label>
            <input type="email" placeholder="wangw@gmail.com"><br><br>

            <label>
                <i>
                    Password
                </i>
                <input type="password" placeholder="password"><br><br>
            </label>

            <p><i>Available Meeting Days:</i></p>

            <label><input type="checkbox" name="days" value="Monday"> Monday</label>
            <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
            <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
            <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
            <label><input type="checkbox" name="days" value="Friday"> Friday</label>
            <label><input type="checkbox" name="days" value="Saturday"> Saturday</label>
            <label><input type="checkbox" name="days" value="Sunday"> Sunday</label>

            <p>
                <label for="time"><i>Available Time:</i></label>
                <select name="time" id="time">
                    <option value="morning">Morning (8am to 12pm)</option>
                    <option value="afternoon">Afternoon (1pm to 5pm)</option>
                    <option value="night">Night (6pm to 10pm)</option>
                </select>
            <p>

            <p>
                <i>Currently working on new website?</i>

                <input type="radio" id="yes" name="working" value="yes">
                <label for="yes">Yes</label>

                <input type="radio" id="no" name="working" value="no">
                <label for="no">No</label>
            </p>

            <p>
                <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Enter your comments here"></textarea>
            </p>
            
            <button type="button" onclick="alert('Submit Button clicked!')">submit</button>
            <button type="button" onclick="alert('Reset Button clicked!')">reset</button>
        </form>

    </center>
</body>

</html>
